name: Build AppImage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils curl \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxcb-xinerama0 libxkbcommon-x11-0 libxcb-util1

      - name: Build AppImage
        working-directory: GriffinUpdater
        run: bash packaging/build_appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: GriffinUpdater-${{ github.sha }}-x86_64
          path: GriffinUpdater/dist/GriffinUpdater-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7
